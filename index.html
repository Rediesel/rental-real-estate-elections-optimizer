<script>
/* localStorage-backed shim for the Claude artifact window.storage API.
   Matches the shapes the app expects:
   - get(key) -> { key, value } ; throws if the key does not exist
   - set(key, value) -> { key, value }
   - list(prefix) -> { keys: [...] }
   - delete(key) -> { key, deleted: true } */
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("Key not found: " + key);
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!prefix || k.startsWith(prefix)) keys.push(k);
    }
    return { keys, prefix };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  }
};
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ============================================================
   Rental Real Estate Elections Optimizer - v5.0
   Internal Planning Tool
   Changelog v5.0 (restyle release):

     export time for version tie-back

   Changelog v3.1 (audit fixes):
   - CORRECTED: Rev. Proc. 2019-38 / 1.199A-1(b)(14) self-rental
     exclusion now keys off 50%+ common control (all flagged
     self-rentals), not the proportionately-identical standard that
     gates 1.469-4(d)(1) grouping. Prior logic misclassified
     commonly controlled but non-identically-owned self-rentals
     (e.g., 60/40 building renting to a 100%-owned op-co) as

   - Auto-T/B explanatory note now renders whenever a self-rental
     exists; common-control assumption disclosed on the input.
   - Duplicate-scenario now respects the 60-scenario cap.
   Changelog v3.0:
   - Client information fields (name, ID, preparer, engagement notes)
   - Named scenario manager: save / load / duplicate / delete with
     persistent storage across sessions (single storage key)
   - Client summary exports: Internal Workpaper (full technical detail,
     citations, sign-off block) and Client Deliverable (plain language,
     no code citations, per firm client-communication standards)
   - Export to Word (.doc download) or PDF (print-formatted view)
   Changelog v2.0: verified TY2025/2026 figures (Rev. Proc. 2024-40,
   Rev. Proc. 2025-32, P.L. 119-21); per-property roster to 25;
   SSTB delineation; 1031 interactions module.
   ============================================================ */

const UI = {
  bg: "#F6F6F4",        // page background - quiet warm-neutral
  surface: "#FFFFFF",   // cards and panels
  ink: "#1B1D1F",       // primary text
  muted: "#6C7076",     // secondary text
  line: "#E2E2DD",      // hairlines
  primary: "#2C4A5E",   // deep slate blue - interactive + emphasis
  primarySoft: "#EDF2F5",
  danger: "#B3372F",
  amber: "#B07A1E",     // caution accents
};
const FONT_STACK = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
const HEAD_FONT = FONT_STACK;
const BODY_FONT = FONT_STACK;
const STORAGE_KEY = "rental-optimizer-scenarios-v1";

/* ---- Verified figures. Indexed items keyed by tax year. ---- */
const FIGURES = {
  2025: {
    label: "2025",
    qbi: {
      mfj: { thr: 394600, top: 494600 },
      mfs: { thr: 197300, top: 247300 },
      other: { thr: 197300, top: 247300 },
      minDeduction: null,
      source: "Rev. Proc. 2024-40; phase-in ranges $50,000 / $100,000 (pre-OBBBA widening)",
    },
    ebl: { joint: 626000, other: 313000, source: "461(l) - Rev. Proc. 2024-40 (OBBBA re-basing applies to 2026, not 2025)" },
    maSurtax: { thr: 1083150, source: "MA DOR - 2025 surtax threshold" },
  },
  2026: {
    label: "2026",
    qbi: {
      mfj: { thr: 403500, top: 553500 },
      mfs: { thr: 201775, top: 276775 },
      other: { thr: 201750, top: 276750 },
      minDeduction: { amount: 400, minQBI: 1000 },
      source: "Rev. Proc. 2025-32 sec. 4.26; OBBBA-widened phase-in ranges ($75,000 / $150,000); OBBBA sec. 70105 minimum deduction",
    },
    ebl: { joint: 512000, other: 256000, source: "461(l) - Rev. Proc. 2025-32 sec. 4.31 (OBBBA re-based indexing - LOWER than 2025)" },
    maSurtax: { thr: 1107750, source: "MA DOR - 2026 surtax threshold" },
  },
};

const STATIC = {
  deMinimis: { noAFS: 2500, AFS: 5000 },
  shst: { cap: 10000, pct: 0.02, buildingMax: 1000000, receiptsMax: 10000000 },
  niit: { mfj: 250000, single: 200000, hoh: 200000, mfs: 125000 },
  allowance: { max: 25000, phaseStart: 100000, phaseEnd: 150000 },
  rep: { hours: 750 },
  rp2019: { hours: 250 },
  x1031: { idDays: 45, closeDays: 180 },
};

const STATUS = {
  recommend: { label: "Recommend", plain: "Recommended", bg: "#ECF4EE", border: "#2E7D4F", text: "#1F5B3A" },
  consider: { label: "Consider", plain: "Worth discussing", bg: "#EDF2F5", border: "#2C4A5E", text: "#24404F" },
  caution: { label: "Caution", plain: "Proceed carefully", bg: "#FAF3E3", border: "#B07A1E", text: "#7C5A12" },
  avoid: { label: "Avoid", plain: "Not recommended this year", bg: "#F9ECEB", border: "#B3372F", text: "#8C2B24" },
  ineligible: { label: "Ineligible", plain: "Not available", bg: "#F0F0EE", border: "#8A8D91", text: "#5B5E63" },
  na: { label: "Not applicable", plain: "Not applicable", bg: "#F0F0EE", border: "#B9BBBE", text: "#6C7076" },
};

/* Plain-language versions for the client deliverable - no code citations. */
const PLAIN = {
  dms: {
    name: "Small-item expensing policy",
    desc: "Lets qualifying purchases under a set dollar limit be deducted in the year paid instead of depreciated over many years. Requires a consistent policy in place at the start of the year.",
  },
  shst: {
    name: "Small building repair safe harbor",
    desc: "Lets smaller buildings deduct modest repair and improvement costs in the current year, within an annual limit per building. Exceeding the limit removes the benefit for the whole year, so spending is planned around it.",
  },
  rep: {
    name: "Real estate professional status",
    desc: "A tax status that can allow rental losses to offset wages and other income when strict annual time and documentation requirements are met. It is closely examined, so careful time logs are essential.",
  },
  agg469: {
    name: "Combined rental activity election",
    desc: "Treats all rental properties as one activity to help meet participation requirements. It is a one-time, binding choice and changes how prior losses are freed up when a single property is later sold.",
  },
  grp: {
    name: "Building and business grouping",
    desc: "Treats a building rented to your own operating company and the company itself as one combined activity, which can make building losses deductible against business income. Binding once made.",
  },
  rp2019: {
    name: "Rental business income deduction safe harbor",
    desc: "A recordkeeping-based method to support the qualified business income deduction (a federal deduction of up to 20 percent) on rental profits. Requires documented service hours and separate books.",
  },
  agg199a: {
    name: "Combined deduction calculation",
    desc: "Combines related businesses when calculating limits on the qualified business income deduction, which can increase the deduction for higher-income owners. Once combined, they generally stay combined.",
  },
  x1031: {
    name: "Like-kind exchange planning",
    desc: "Trading one investment property for another can defer tax on the gain. It interacts with prior losses and future deductions in specific ways that we plan around before any exchange is set in motion.",
  },
};

const fmt = (n) =>
  n === null || n === undefined || isNaN(n)
    ? "-"
    : n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

const esc = (s) =>
  String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const propLabel = (pr) => pr.name || "(unnamed property)";

let nextId = 1;
const newProperty = (type) => ({
  id: nextId++,
  name: "",
  type,
  net: 0,
  basis: 500000,
  repairSpend: 0,
  nnn: false,
  selfRental: false,
  personalUse: false,
  costSeg: false,
  wagesPaid: false,
  disposition: "none",
});

const DEFAULT_T = {
  filingStatus: "mfj",
  magi: 450000,
  taxableIncome: 420000,
  otherQBIType: "qualified",
  otherPassiveIncome: false,
  maResident: true,
  hasAFS: false,
  spouseHours750: false,
  spouseMoreThanHalf: false,
  contemporaneousLogs: false,
  hours250Documentable: false,
  identicalOwnership: false,
  opCoSSTB: false,
  materialParticipationOpCo: false,
  grossReceiptsUnder10M: true,
};

const DEFAULT_CLIENT = { name: "", number: "", preparer: "", notes: "" };

/* ================= Decision engine (unchanged from v2.0) ================= */

function evaluate(t, props, year) {
  const F = FIGURES[year];
  const elections = [];
  const flags = [];

  const qbiKey = t.filingStatus === "mfj" ? "mfj" : t.filingStatus === "mfs" ? "mfs" : "other";
  const qbiBand = F.qbi[qbiKey];
  const qbiPosition =
    t.taxableIncome <= qbiBand.thr ? "below" : t.taxableIncome <= qbiBand.top ? "phasein" : "above";
  const qbiPosLabel =
    qbiPosition === "below"
      ? `Below threshold (${fmt(qbiBand.thr)})`
      : qbiPosition === "phasein"
      ? `In phase-in range (${fmt(qbiBand.thr)} - ${fmt(qbiBand.top)})`
      : `Above phase-in top (${fmt(qbiBand.top)})`;

  const niitThr = STATIC.niit[t.filingStatus];
  const niitExposed = t.magi > niitThr;
  const eblThr = t.filingStatus === "mfj" ? F.ebl.joint : F.ebl.other;

  const numProps = props.length;
  const resProps = props.filter((p) => p.type === "residential");
  const comProps = props.filter((p) => p.type === "commercial");
  const totalNet = props.reduce((s, p) => s + (Number(p.net) || 0), 0);
  const netLoss = totalNet < 0;
  const netIncome = totalNet > 0;
  const lossAbs = Math.abs(Math.min(totalNet, 0));
  const anySelfRental = props.some((p) => p.selfRental);
  const selfRentalProps = props.filter((p) => p.selfRental);
  const selfRentalNet = selfRentalProps.reduce((s, p) => s + (Number(p.net) || 0), 0);
  const selfRentalLossExpected = selfRentalProps.some((p) => Number(p.net) < 0 || p.costSeg);
  const anyWages = props.some((p) => p.wagesPaid);
  const saleProps = props.filter((p) => p.disposition === "sale");
  const exchProps = props.filter((p) => p.disposition === "exchange");
  const costSegProps = props.filter((p) => p.costSeg);

  const repQualifies = t.spouseHours750 && t.spouseMoreThanHalf;
  const repViable = repQualifies && t.contemporaneousLogs;

  const sstbOther = t.otherQBIType === "sstb" || t.otherQBIType === "both";
  const qualifiedOther = t.otherQBIType === "qualified" || t.otherQBIType === "both";

  const allowance =
    !repQualifies && netLoss
      ? Math.max(0, STATIC.allowance.max - 0.5 * Math.max(0, t.magi - STATIC.allowance.phaseStart))
      : null;

  /* ---- 1. De minimis ---- */
  {
    const reasons = [];
    const warnings = [];
    let status = "recommend";
    const cap = t.hasAFS ? STATIC.deMinimis.AFS : STATIC.deMinimis.noAFS;
    reasons.push(
      `Per-item/invoice ceiling: ${fmt(cap)} (${t.hasAFS ? "AFS - written policy required at start of year" : "no AFS - accounting policy must exist at start of year"}). Reg. 1.263(a)-1(f); regulatory amounts, not indexed.`
    );
    if (t.maResident) {
      reasons.push(
        "MA conforms to the 263(a) regs but decouples from bonus depreciation. For sub-ceiling items, de minimis beats capitalize-and-bonus: same federal result, no MA addback, no shadow MA schedule."
      );
    }
    const ubiaConstrained = (qbiPosition === "above" || qbiPosition === "phasein") && netIncome && !anyWages;
    if (ubiaConstrained) {
      status = "caution";
      warnings.push(
        "Taxable income is in/above the phase-in range and no property pays W-2 wages, so the 2.5% UBIA prong is doing the work. Expensed items never enter UBIA - consider capitalizing (and bonusing) larger qualifying items to preserve UBIA, accepting the MA addback as the price."
      );
    }
    const passiveSuspended =
      netLoss && !repViable && !(anySelfRental && t.identicalOwnership && selfRentalLossExpected) && !t.otherPassiveIncome && (allowance === 0 || allowance === null);
    if (passiveSuspended) {
      status = status === "caution" ? "caution" : "consider";
      warnings.push(
        "Losses appear passive and suspended with no absorption path: de minimis deductions only enlarge the suspended pile while permanently forfeiting UBIA and basis."
      );
    }
    if (exchProps.length > 0) {
      warnings.push(
        "1031 note: items expensed under de minimis are not part of the exchanged basis of relinquished property - immaterial individually, but heavy expensing on an exchange-bound building shrinks the basis story that carries to the replacement."
      );
    }
    warnings.push("Annual election, all-or-nothing across qualifying items - no cherry-picking within the year.");
    elections.push({ id: "dms", name: "De Minimis Safe Harbor", authority: "Reg. 1.263(a)-1(f)", status, reasons, warnings });
  }

  /* ---- 2. SHST ---- */
  {
    const reasons = [];
    const warnings = [];
    let status;
    const rows = [];
    if (!t.grossReceiptsUnder10M) {
      status = "ineligible";
      reasons.push(`Average annual gross receipts exceed ${fmt(STATIC.shst.receiptsMax)} - no building qualifies.`);
    } else if (numProps === 0) {
      status = "na";
      reasons.push("No properties entered.");
    } else {
      let anyElect = false, anyCliff = false, anyNear = false;
      props.forEach((pr) => {
        const basis = Number(pr.basis) || 0;
        const spend = Number(pr.repairSpend) || 0;
        if (basis > STATIC.shst.buildingMax) {
          rows.push({ name: propLabel(pr), verdict: "Ineligible", detail: `Unadjusted basis ${fmt(basis)} exceeds $1M` });
        } else {
          const ceiling = Math.min(STATIC.shst.cap, STATIC.shst.pct * basis);
          if (spend > ceiling) {
            anyCliff = true;
            rows.push({ name: propLabel(pr), verdict: "Cliff blown", detail: `Spend ${fmt(spend)} > ceiling ${fmt(ceiling)} - safe harbor unavailable for ANY amount this year` });
          } else if (spend > 0.8 * ceiling) {
            anyNear = true;
            rows.push({ name: propLabel(pr), verdict: "Near cliff", detail: `Spend ${fmt(spend)} vs ceiling ${fmt(ceiling)} - one unplanned repair blows it retroactively` });
          } else {
            anyElect = true;
            rows.push({ name: propLabel(pr), verdict: "Elect", detail: `Spend ${fmt(spend)} vs ceiling ${fmt(ceiling)}` });
          }
        }
      });
      status = anyCliff && !anyElect && !anyNear ? "avoid" : anyNear || anyCliff ? "caution" : anyElect ? "recommend" : "ineligible";
      reasons.push("Elected annually, per eligible building - the per-property verdicts below control. Ceiling = lesser of $10,000 or 2% of unadjusted basis; de minimis and routine maintenance amounts count toward it.");
      if (anyCliff) warnings.push("Cliff properties: consider sequencing projects into next year to restore eligibility.");
    }
    elections.push({ id: "shst", name: "Small Taxpayer Safe Harbor (SHST)", authority: "Reg. 1.263(a)-3(h)", status, reasons, warnings, table: rows });
  }

  /* ---- 3. REP ---- */
  {
    const reasons = [];
    const warnings = [];
    let status;
    if (!repQualifies) {
      status = "ineligible";
      reasons.push(
        !t.spouseHours750
          ? "No spouse logs more than 750 hours in real property trades/businesses (statutory, not indexed)."
          : "No spouse spends more than 50% of ALL personal services in real property businesses - a full-time outside W-2 job effectively fails this."
      );
      if (allowance !== null && allowance > 0) {
        reasons.push(`Fallback: 469(i) active participation allowance of ${fmt(allowance)} of loss usable against nonpassive income (statutory $25K, MAGI phaseout $100K-$150K${t.filingStatus === "mfs" ? "; MFS living together gets $0" : ""}).`);
      }
    } else if (!t.contemporaneousLogs) {
      status = "caution";
      reasons.push("Legal tests appear met but no contemporaneous time log exists. This position fails on documentation more than law. Build the log before taking the position.");
    } else if (netLoss) {
      status = "recommend";
      reasons.push("Qualifying spouse + portfolio losses + nonpassive income to absorb them: losses become currently deductible instead of suspending.");
      if (lossAbs > eblThr) {
        warnings.push(
          `Projected loss of ${fmt(-lossAbs)} exceeds the ${year} 461(l) threshold of ${fmt(eblThr)} (${F.ebl.source}). Excess carries forward as an NOL. Note the 2026 threshold is LOWER than 2025 - OBBBA re-based the indexing to the original $250K/$500K amounts.`
        );
      }
      if (costSegProps.length > 0 && t.maResident) {
        warnings.push("Cost seg + bonus builds the federal loss, but MA decouples from bonus - the MA loss will be far smaller. Build the shadow MA depreciation schedule at acquisition.");
      }
      warnings.push("Highest-audit-risk position on Schedule E; retested annually; maintain contemporaneous logs every year.");
      warnings.push("Asymmetry: once nonpassive, future profitable rental years cannot absorb the client's other passive losses.");
    } else {
      status = "consider";
      reasons.push("Qualifying spouse with a profitable/breakeven portfolio: no loss benefit, but NIIT relief may justify the position.");
      if (niitExposed) {
        reasons.push(`MAGI ${fmt(t.magi)} exceeds the ${fmt(niitThr)} NIIT threshold (statutory). REP + material participation + the 500-hour 1.1411 safe harbor removes rental income from NII - a permanent 3.8% annual saving.`);
      }
    }
    elections.push({ id: "rep", name: "Real Estate Professional Status", authority: "IRC 469(c)(7)", status, reasons, warnings });
  }

  /* ---- 4. 1.469-9(g) ---- */
  {
    const reasons = [];
    const warnings = [];
    let status;
    const trapSales = saleProps.map(propLabel);
    if (!repQualifies) {
      status = "na";
      reasons.push("Only meaningful with REP status - it exists to satisfy material participation across the portfolio as one activity.");
    } else if (numProps <= 1) {
      status = "na";
      reasons.push("Single rental property - nothing to aggregate.");
    } else if (trapSales.length > 0) {
      status = "caution";
      reasons.push(`REP viable with ${numProps} properties, but taxable sale(s) planned: ${trapSales.join(", ")}.`);
      warnings.push("Disposition trap: once aggregated, selling one property is not a complete disposition, so 469(g) does NOT release that property's suspended losses at sale. Consider timing the election until after the planned sale(s).");
      if (exchProps.length > 0) {
        warnings.push(`Exchange-flagged properties (${exchProps.map(propLabel).join(", ")}) are a different story: a 1031 is not a fully taxable disposition and would not release suspended losses anyway, so aggregation costs little on those.`);
      }
    } else {
      status = "recommend";
      reasons.push(`Meeting material participation across ${numProps} properties individually is nearly impossible; across one aggregated activity it is routine.`);
      if (exchProps.length > 0) {
        reasons.push("Planned dispositions are 1031 exchanges only - exchanges do not trigger 469(g) loss release regardless, so the aggregation disposition trap has little bite here.");
      }
      warnings.push("One-time election, binding on all future years; dormant in non-REP years and reactivates. Revocable only on material change in facts.");
      warnings.push("A rental grouped with an operating business under 1.469-4 cannot also sit inside this election.");
    }
    elections.push({ id: "agg469", name: "Rental Aggregation Election (REP)", authority: "Reg. 1.469-9(g)", status, reasons, warnings });
  }

  /* ---- 5. 1.469-4 grouping ---- */
  {
    const reasons = [];
    const warnings = [];
    let status;
    if (!anySelfRental) {
      status = "na";
      reasons.push("No property is flagged as a self-rental.");
    } else if (!t.identicalOwnership) {
      status = "ineligible";
      reasons.push("Rental and operating company ownership are not proportionately identical - 1.469-4(d)(1) grouping is off the table. Planning reverts to managing the recharacterization rule (income nonpassive, losses passive).");
    } else if (selfRentalLossExpected && t.materialParticipationOpCo) {
      status = "recommend";
      reasons.push(`Self-rental propert${selfRentalProps.length > 1 ? "ies" : "y"} (${selfRentalProps.map(propLabel).join(", ")}) expected to throw losses with material participation in the op-co: grouping makes the combined activity nonpassive both directions, so building losses deduct currently against operating income.`);
      warnings.push("Elect BEFORE the loss year. Without grouping, 1.469-2(f)(6) recharacterizes self-rental income as nonpassive while losses stay passive.");
      warnings.push("Binding until material change in facts; suspended-loss release keys off complete disposition of the group.");
    } else if (selfRentalNet >= 0) {
      status = "consider";
      reasons.push("Income-only self-rental: recharacterization already makes the income nonpassive, and recharacterized self-rental income is excluded from NII under 1.1411-4(g)(6). Grouping adds little while locking in a binding election - low priority unless losses are foreseeable.");
    } else {
      status = "caution";
      reasons.push("Self-rental losses expected but material participation in the op-co is unconfirmed - grouping only converts the losses to nonpassive if the taxpayer materially participates in the combined activity.");
    }
    if (anySelfRental) {
      if (selfRentalProps.some((p) => p.disposition === "exchange")) {
        warnings.push("A grouped self-rental building headed into a 1031: the replacement property must continue serving the grouped activity or you have a material change - map the post-exchange structure before electing.");
      }
      warnings.push("Disclose grouping per Rev. Proc. 2010-13 in the first year.");
    }
    elections.push({ id: "grp", name: "Self-Rental Grouping", authority: "Reg. 1.469-4(d)(1)", status, reasons, warnings });
  }

  /* ---- 6. Rev. Proc. 2019-38 ---- */
  {
    const reasons = [];
    const warnings = [];
    let status;
    // Self-rentals are excluded on 50%+ COMMON CONTROL (Rev. Proc. 2019-38 sec. 3.05; 1.199A-1(b)(14)),
    // NOT the stricter proportionately-identical standard that gates 1.469-4(d)(1) grouping.
    // Every property flagged "self-rental to client's op-co" is treated as commonly controlled.
    const eligible = (arr) => arr.filter((p) => !p.nnn && !p.personalUse && !p.selfRental);
    const resElig = eligible(resProps);
    const comElig = eligible(comProps);
    const resNet = resElig.reduce((s, p) => s + (Number(p.net) || 0), 0);
    const comNet = comElig.reduce((s, p) => s + (Number(p.net) || 0), 0);
    const eligCount = resElig.length + comElig.length;
    const eligNet = resNet + comNet;

    if (numProps === 0) {
      status = "na";
      reasons.push("No properties entered.");
    } else if (eligCount === 0) {
      status = "ineligible";
      reasons.push("Every property is excluded from the safe harbor (NNN lease, 280A personal use, or commonly controlled self-rental). For NNN properties the QBI position rests on 162 general facts; commonly controlled self-rentals are automatically 162 trades or businesses under 1.199A-1(b)(14) and need no safe harbor, even on NNN terms.");
    } else if (eligNet < 0 && qualifiedOther) {
      status = "avoid";
      reasons.push(`Eligible enterprise net is ${fmt(eligNet)} with positive QBI elsewhere: trade-or-business status makes the rental loss negative QBI that nets against the client's other QBI deduction. Think hard before establishing T/B status in a loss year - consistency counsels against opportunistic year-by-year positions.`);
    } else if (eligNet < 0) {
      status = "na";
      reasons.push("Eligible enterprise net is negative with no other QBI to protect: the safe harbor delivers nothing now. Revisit in income years.");
    } else if (t.hours250Documentable) {
      status = "recommend";
      reasons.push(`Profitable eligible enterprise(s) with 250+ documentable hours (${STATIC.rp2019.hours} hours per enterprise per year; 250 in 3 of the last 5 for enterprises 4+ years old; owner, employee, agent, and contractor hours count).`);
      if (qbiPosition === "below") {
        reasons.push(`Taxable income ${fmt(t.taxableIncome)} is below the ${year} threshold (${fmt(qbiBand.thr)}), so wage/UBIA limits do not apply - the safe harbor's value is simply establishing trade-or-business status.`);
      }
      warnings.push("Separate books per enterprise, contemporaneous service records, annual penalties-of-perjury statement.");
      warnings.push("T/B status implies 1099-NEC obligations for contractor payments - answer the Schedule E 1099 questions consistently.");
    } else {
      status = "consider";
      reasons.push("Profitable but the 250-hour record cannot be built. The safe harbor is sufficient, not necessary - assess and document a 162 trade-or-business position on general facts (reasonable basis to substantial authority depending on facts) rather than abandoning QBI.");
    }
    if (resElig.length > 0 && comElig.length > 0) {
      warnings.push(`Mixed portfolio: commercial and residential CANNOT share one enterprise. Two enterprises minimum - residential (${resElig.map(propLabel).join(", ")}; net ${fmt(resNet)}) and commercial (${comElig.map(propLabel).join(", ")}; net ${fmt(comNet)}) - each needing its own 250 hours and separate books. If one side is a loss enterprise and the other profitable, the analysis applies per enterprise, not in aggregate.`);
    }
    const nnnList = props.filter((p) => p.nnn && !p.selfRental);
    if (nnnList.length > 0 && eligCount > 0) {
      warnings.push(`Carve NNN properties out of the safe-harbor enterprise: ${nnnList.map(propLabel).join(", ")}. Support QBI on those under 162 general facts separately.`);
    }
    if (selfRentalProps.length > 0) {
      reasons.push(`Self-rental note (${selfRentalProps.map(propLabel).join(", ")}): rentals to a 50%+ commonly controlled trade or business are excluded from the safe harbor because they are automatically 162 trades or businesses under 1.199A-1(b)(14) - even on NNN terms. The tool treats every flagged self-rental as commonly controlled; if the client actually owns less than 50% of either side, the automatic treatment does not apply - revisit manually.`);
    }
    if (year === 2026 && F.qbi.minDeduction && eligNet >= F.qbi.minDeduction.minQBI) {
      reasons.push(`New for 2026 (OBBBA sec. 70105): a minimum ${fmt(F.qbi.minDeduction.amount)} deduction applies with at least ${fmt(F.qbi.minDeduction.minQBI)} of QBI from active trades or businesses in which the taxpayer materially participates - a floor, relevant mainly to small QBI amounts. Both amounts index after 2026.`);
    }
    elections.push({ id: "rp2019", name: "199A Rental Safe Harbor", authority: "Rev. Proc. 2019-38", status, reasons, warnings });
  }

  /* ---- 7. 1.199A-4 aggregation ---- */
  {
    const reasons = [];
    const warnings = [];
    let status;
    if (qbiPosition === "below") {
      status = "na";
      reasons.push(`Taxable income ${fmt(t.taxableIncome)} is below the ${year} threshold of ${fmt(qbiBand.thr)} - the W-2 wage / UBIA limits do not apply, so aggregation has no computational benefit.`);
    } else if (totalNet < 0) {
      status = "na";
      reasons.push("Aggregation does not help negative QBI - loss businesses net against income businesses pro rata whether or not aggregated.");
    } else if (numProps <= 1 && !anySelfRental) {
      status = "na";
      reasons.push("Single trade or business - nothing to aggregate.");
    } else if (anyWages) {
      status = "recommend";
      reasons.push(`Income in/above the phase-in range (${qbiPosLabel}) with uneven wage capacity: aggregation blends W-2 wages and UBIA so ${props.filter((p) => p.wagesPaid).map(propLabel).join(", ")} lend wage capacity to the wage-less siblings.`);
      warnings.push("Requires 50%+ common ownership, same tax year, non-SSTB, and 2 of 3 integration factors - confirm in a file memo before the first disclosure.");
      warnings.push("One-way door: once aggregated, must stay aggregated absent changed facts. You can add businesses; you cannot peel them off.");
    } else {
      status = "consider";
      reasons.push("In/above the phase-in range but no rental W-2 wages anywhere: aggregation pools UBIA only. Model the combined 2.5% UBIA prong against the tentative deduction before committing to a one-way door.");
    }
    if (exchProps.length > 0 && qbiPosition !== "below") {
      warnings.push("UBIA planning note for exchange-flagged properties: under 1.199A-2(c)(3), replacement property received in a 1031 generally takes the RELINQUISHED property's UBIA and placed-in-service date for the exchanged-basis portion (excess basis is treated as new). An exchange does not refresh a stale UBIA.");
    }
    if (anySelfRental && t.opCoSSTB && qbiPosition !== "below") {
      warnings.push("SSTB exclusion: an SSTB - and self-rental income tainted by common SSTB control - cannot be aggregated.");
    }
    elections.push({ id: "agg199a", name: "199A Aggregation", authority: "Reg. 1.199A-4", status, reasons, warnings });
  }

  /* ---- 8. 1031 module ---- */
  {
    const reasons = [];
    const warnings = [];
    let status;
    if (exchProps.length === 0) {
      status = "na";
      reasons.push("No property is flagged for a like-kind exchange. Flag a property's disposition plan as '1031 exchange' to see the interaction analysis.");
    } else {
      status = "consider";
      reasons.push(`Exchange-flagged: ${exchProps.map(propLabel).join(", ")}. Post-TCJA, 1031 applies to real property only. Mechanics: ${STATIC.x1031.idDays}-day identification, ${STATIC.x1031.closeDays}-day close, qualified intermediary required, Form 8824.`);
      reasons.push("Suspended passive losses are NOT released by an exchange - a 1031 is not a fully taxable disposition, so 469(g) does not trigger. If the goal is freeing a property's suspended losses, a taxable sale does that; a 1031 defers gain but keeps the losses locked.");
      const segExch = exchProps.filter((p) => p.costSeg);
      if (segExch.length > 0) {
        warnings.push(`Cost-seg-before-exchange trap on ${segExch.map(propLabel).join(", ")}: segregated 1245 components carry ordinary recapture exposure. If the replacement property lacks equivalent 1245 property, 1245 recapture can be recognized in an otherwise deferred exchange. Coordinate the cost seg engineer, the QI, and the exchange structure before closing.`);
      }
      if (qbiPosition !== "below" && netIncome) {
        warnings.push("UBIA carryover (1.199A-2(c)(3)): the exchanged-basis portion of the replacement keeps the relinquished property's UBIA and its original placed-in-service date for the depreciable-period clock; only excess basis is treated as newly acquired. Model whether the old UBIA still carries the deduction post-exchange.");
      }
      warnings.push("Depreciation on the replacement: exchanged basis continues the old schedule (or elect out under 1.168(i)-6); excess basis depreciates fresh - and only the excess-basis portion generates new bonus-eligible property. MA conforms to 1031 but still decouples from bonus on any excess basis.");
      if (repQualifies && numProps > 1) {
        warnings.push("If a 1.469-9(g) aggregation is in place or planned, exchanges within the aggregated activity are lower-stakes than taxable sales - the disposition trap is about loss release, which an exchange never triggers anyway.");
      }
      if (t.maResident) {
        reasons.push("Massachusetts conforms to 1031 nonrecognition. The MA-vs-federal basis difference from bonus decoupling carries into the replacement - track both schedules through the exchange.");
      }
    }
    elections.push({ id: "x1031", name: "Like-Kind Exchange Interactions", authority: "IRC 1031; Reg. 1.199A-2(c)(3); Reg. 1.168(i)-6", status, reasons, warnings });
  }

  /* ---- Flags ---- */
  if (sstbOther) {
    if (qbiPosition === "above") {
      flags.push({
        title: "SSTB - deduction eliminated",
        body: `Taxable income ${fmt(t.taxableIncome)} exceeds the ${year} phase-in top of ${fmt(qbiBand.top)}: QBI deduction on SSTB income is fully phased out. Rental QBI from non-tainted properties is unaffected - keep the rental enterprises cleanly separated from the SSTB.`,
      });
    } else if (qbiPosition === "phasein") {
      flags.push({
        title: "SSTB - partial phase-out",
        body: `Taxable income sits in the ${year} phase-in range (${fmt(qbiBand.thr)} - ${fmt(qbiBand.top)}): the SSTB deduction phases down through the range. Income-timing moves that hold taxable income under the threshold restore the full deduction.`,
      });
    }
  }
  if (props.some((p) => p.selfRental) && t.opCoSSTB && qbiPosition !== "below") {
    flags.push({
      title: "SSTB taint on self-rental",
      body: "Rental income from property leased to a commonly controlled SSTB is treated as SSTB income to the extent of common ownership (Reg. 1.199A-5(c)(2)). In/above the phase-in range, that rental's QBI is limited or eliminated, and above-market-rent income-shifting to the building is dead (and invites rent-reasonableness scrutiny).",
    });
  }
  if (niitExposed) {
    flags.push({
      title: "NIIT exposure",
      body: `MAGI ${fmt(t.magi)} exceeds the ${fmt(niitThr)} threshold (statutory, never indexed). Rental income is NII unless earned in a nonpassive trade or business - REP with the 500-hour 1.1411 safe harbor, or self-rental treatment, removes the 3.8%.`,
    });
  }
  if (allowance !== null) {
    flags.push({
      title: "469(i) $25K allowance",
      body:
        allowance > 0
          ? `Without REP, up to ${fmt(allowance)} of loss is usable against nonpassive income (active participation + 10% ownership required).`
          : "MAGI of $150K+ fully phases out the allowance - passive losses suspend absent REP or grouping.",
    });
  }
  if (t.maResident) {
    const nearSurtax = t.taxableIncome > 0.85 * F.maSurtax.thr;
    flags.push({
      title: `Massachusetts overlay (${year} surtax threshold ${fmt(F.maSurtax.thr)})`,
      body:
        "MA conforms to 469 mechanics and the 263(a) regs; decouples from bonus depreciation; 199A never touches the MA return; 1031 nonrecognition conforms. " +
        (nearSurtax
          ? `Federal taxable income of ${fmt(t.taxableIncome)} is within reach of the ${fmt(F.maSurtax.thr)} surtax line (MA taxable income differs from federal - model on the MA base).`
          : "Client is not near the 4% surtax threshold on these inputs."),
    });
  }
  if (repViable && netLoss && lossAbs > eblThr) {
    flags.push({
      title: `461(l) excess business loss (${year}: ${fmt(eblThr)})`,
      body: `Nonpassive loss exceeds the ${year} threshold. ${year === 2026 ? "OBBBA re-based the indexing, so the 2026 threshold ($256K/$512K) is LOWER than 2025 ($313K/$626K) - do not carry forward last year's number." : "Note: the threshold DROPS in 2026 ($256K/$512K) under OBBBA's re-based indexing - plan multi-year losses accordingly."} Excess carries forward as an NOL (80% limitation).`,
    });
  }

  return {
    elections,
    flags,
    qbiPosition,
    qbiPosLabel,
    qbiBand,
    totals: { totalNet, numProps, res: resProps.length, com: comProps.length, exch: exchProps.length, sales: saleProps.length },
  };
}

function downloadDoc(html, filename) {
  try {
    const blob = new Blob(["\ufeff" + html], { type: "application/msword" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch (e) {
    console.error("Word export failed:", e);
    return false;
  }
}

function printHTML(html) {
  try {
    const iframe = document.createElement("iframe");
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "0";
    document.body.appendChild(iframe);
    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
    setTimeout(() => {
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch (e) {
        console.error("Print failed:", e);
      }
      setTimeout(() => document.body.removeChild(iframe), 2000);
    }, 350);
    return true;
  } catch (e) {
    console.error("Print setup failed:", e);
    return false;
  }
}

        onFocus={() => setText(String(Number(value) || 0))}
        onBlur={() => setText(null)}
        onChange={(e) => {
          const raw = e.target.value;
          setText(raw);
          const stripped = raw.replace(/,/g, "").trim();
          if (stripped === "") { onChange(0); return; }
          if (stripped === "-") return; // mid-typing a negative
          const n = Number(stripped);
          if (!isNaN(n)) onChange(n);
        }}
        className="w-full text-sm px-2 py-1.5 bg-white focus:outline-none focus:ring-2"
        style={{ border: `1px solid ${warn ? "#B3372F" : UI.line}`, borderRadius: 6, color: UI.ink }}
      />
      {warn ? (
        <p className="text-xs mt-1 font-bold" style={{ color: "#B3372F" }}>{warn}</p>
      ) : hint ? (
        <p className="text-xs mt-1" style={{ color: UI.muted }}>{hint}</p>
      ) : null}
    </div>
  );
}

function RentalElectionsOptimizerV3() {
  const [year, setYear] = useState(2026);
  const [client, setClient] = useState({ ...DEFAULT_CLIENT });
  const [t, setT] = useState({ ...DEFAULT_T });
  const [props, setProps] = useState([
    { ...newProperty("residential"), name: "Two-family, Weymouth", net: -18000, basis: 420000, repairSpend: 6000 },
    { ...newProperty("residential"), name: "Condo, Quincy", net: -9000, basis: 310000, repairSpend: 2500 },
  ]);

  const [scenarios, setScenarios] = useState([]);
  const [currentScenarioId, setCurrentScenarioId] = useState(null);
  const [storageState, setStorageState] = useState("loading"); // loading | ready | unavailable
  const [saveMsg, setSaveMsg] = useState("");
  const [armDelete, setArmDelete] = useState(null);

  // UX state (v4.0)
  const [openProps, setOpenProps] = useState({}); // property card open/closed; undefined -> index<5 default
  const [changedIds, setChangedIds] = useState([]); // election ids whose status just flipped
  const prevStatuses = useRef({});
  const [compareOpen, setCompareOpen] = useState(false);
  const [cmpA, setCmpA] = useState("");
  const [cmpB, setCmpB] = useState("");
  const [scnQuery, setScnQuery] = useState("");
  const [scnSort, setScnSort] = useState("recent"); // recent | name

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORAGE_KEY);
        const list = r && r.value ? JSON.parse(r.value) : [];
        setScenarios(Array.isArray(list) ? list : []);
        setStorageState("ready");
      } catch (e) {
        // Key not existing throws - treat as empty but functional. Probe with a set/list to detect availability.
        try {
          await window.storage.list("rental-optimizer");
          setScenarios([]);
          setStorageState("ready");
        } catch (e2) {
          setScenarios([]);
          setStorageState("unavailable");
        }
      }
    })();
  }, []);

  const persist = async (list) => {
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(list));
      if (!result) throw new Error("set returned null");
      return true;
    } catch (e) {
      console.error("Storage save failed:", e);
      setStorageState("unavailable");
      return false;
    }
  };

  const flash = (msg) => {
    setSaveMsg(msg);
    setTimeout(() => setSaveMsg(""), 3500);
  };

  const saveScenario = async () => {
    const id = currentScenarioId || `sc_${Date.now()}`;
    const entry = {
      id,
      savedAt: new Date().toISOString(),
      client: { ...client },
      year,
      t: { ...t },
      props: props.map((p) => ({ ...p })),
    };
    const list = scenarios.some((s) => s.id === id)
      ? scenarios.map((s) => (s.id === id ? entry : s))
      : [...scenarios, entry];
    if (list.length > 60) {
      flash("Scenario limit (60) reached - delete older scenarios first.");
      return;
    }
    setScenarios(list);
    setCurrentScenarioId(id);
    const ok = await persist(list);
    flash(ok ? `Saved "${client.name || "Untitled"}" (${new Date().toLocaleTimeString()})` : "Saved for this session only - persistent storage unavailable.");
  };

  const loadScenario = (s) => {
    setClient({ ...DEFAULT_CLIENT, ...s.client });
    setYear(s.year === 2025 ? 2025 : 2026);
    setT({ ...DEFAULT_T, ...s.t });
    const loaded = (s.props || []).map((p) => ({ ...newProperty(p.type || "residential"), ...p }));
    const maxId = loaded.reduce((m, p) => Math.max(m, Number(p.id) || 0), 0);
    nextId = maxId + 1;
    setProps(loaded);
    setCurrentScenarioId(s.id);
    setArmDelete(null);
    setOpenProps({}); // default: first five open, rest collapsed
    flash(`Loaded "${s.client?.name || "Untitled"}"`);
  };

  const duplicateScenario = async (s) => {
    if (scenarios.length >= 60) {
      flash("Scenario limit (60) reached - delete older scenarios first.");
      return;
    }
    const copy = {
      ...s,
      id: `sc_${Date.now()}`,
      savedAt: new Date().toISOString(),
      client: { ...s.client, name: `${s.client?.name || "Untitled"} (what-if)` },
    };
    const list = [...scenarios, copy];
    setScenarios(list);
    await persist(list);
    flash(`Duplicated as "${copy.client.name}"`);
  };

  const deleteScenario = async (id) => {
    if (armDelete !== id) {
      setArmDelete(id);
      return;
    }
    const list = scenarios.filter((s) => s.id !== id);
    setScenarios(list);
    if (currentScenarioId === id) setCurrentScenarioId(null);
    setArmDelete(null);
    await persist(list);
    flash("Scenario deleted.");
  };

  const newScenario = () => {
    setClient({ ...DEFAULT_CLIENT });
    setT({ ...DEFAULT_T });
    setProps([]);
    setCurrentScenarioId(null);
    setYear(2026);
    setOpenProps({});
    flash("New blank scenario.");
  };

  const setField = (k) => (v) => setT((prev) => ({ ...prev, [k]: v }));
  const setClientField = (k) => (v) => setClient((prev) => ({ ...prev, [k]: v }));
  const updateProp = (id) => (next) => setProps((arr) => arr.map((p) => (p.id === id ? next : p)));
  const removeProp = (id) => () => setProps((arr) => arr.filter((p) => p.id !== id));
  const addProp = (type) => () =>
    setProps((arr) => {
      if (arr.length >= 25) return arr;
      const np = newProperty(type);
      setOpenProps((m) => ({ ...m, [np.id]: true }));
      return [...arr, np];
    });

  // Property card open rule: explicit choice wins; otherwise first five open by default
  const isPropOpen = (id, idx) => (openProps[id] !== undefined ? openProps[id] : idx < 5);
  const toggleProp = (id, idx) => () => setOpenProps((m) => ({ ...m, [id]: !isPropOpen(id, idx) }));
  const setAllProps = (val) => () => setOpenProps(Object.fromEntries(props.map((p) => [p.id, val])));

  const anySelfRental = props.some((p) => p.selfRental);
  const result = useMemo(() => evaluate(t, props, year), [t, props, year]);
  const F = FIGURES[year];

  // Triage counts by status, in severity order
  const TRIAGE_ORDER = ["recommend", "consider", "caution", "avoid", "ineligible", "na"];
  const triage = useMemo(() => {
    const c = {};
    result.elections.forEach((e) => { c[e.status] = (c[e.status] || 0) + 1; });
    return c;
  }, [result]);

  // Flash election cards whose status flipped on the latest input change
  useEffect(() => {
    const cur = {};
    result.elections.forEach((e) => { cur[e.id] = e.status; });
    const prev = prevStatuses.current;
    const diff = Object.keys(cur).filter((id) => prev[id] && prev[id] !== cur[id]);
    prevStatuses.current = cur;
    if (diff.length > 0) {
      setChangedIds(diff);
      const timer = setTimeout(() => setChangedIds([]), 2200);
      return () => clearTimeout(timer);
    }
  }, [result]);

  // Scenario list: filter + sort
  const visibleScenarios = useMemo(() => {
    const q = scnQuery.trim().toLowerCase();
    let list = scenarios.filter(
      (s) => !q || (s.client?.name || "").toLowerCase().includes(q) || (s.client?.number || "").toLowerCase().includes(q)
    );
    list = list.slice().sort((a, b) =>
      scnSort === "name"
        ? (a.client?.name || "").localeCompare(b.client?.name || "")
        : (b.savedAt || "").localeCompare(a.savedAt || "")
    );
    return list;
  }, [scenarios, scnQuery, scnSort]);

  // Comparison: evaluate a stored scenario with defaults merged (handles older saves)
  const evalStored = (s) => {
    if (!s) return null;
    const tt = { ...DEFAULT_T, ...(s.t || {}) };
    const pp = (s.props || []).map((p) => ({ ...newProperty(p.type || "residential"), ...p }));
    const yr = s.year === 2025 ? 2025 : 2026;
    return { s, tt, pp, yr, r: evaluate(tt, pp, yr) };
  };
  const cmpAData = useMemo(() => evalStored(scenarios.find((s) => s.id === cmpA)), [cmpA, scenarios]);
  const cmpBData = useMemo(() => evalStored(scenarios.find((s) => s.id === cmpB)), [cmpB, scenarios]);

  const exportWord = (mode) => {
    const saved = scenarios.find((s) => s.id === currentScenarioId);
    const meta = { id: currentScenarioId, savedAt: saved?.savedAt };
    const html = mode === "client" ? buildClientHTML(client, t, props, year, result) : buildWorkpaperHTML(client, t, props, year, result, meta);
    const suffix = mode === "client" ? "Client_Summary" : "Workpaper";
    const ok = downloadDoc(html, `${sanitize(client.name)}_${suffix}_TY${year}.doc`);
    flash(ok ? "Word document downloaded." : "Export failed - try the PDF/print option.");
  };
  const exportPDF = (mode) => {
    const saved = scenarios.find((s) => s.id === currentScenarioId);
    const meta = { id: currentScenarioId, savedAt: saved?.savedAt };
    const html = mode === "client" ? buildClientHTML(client, t, props, year, result) : buildWorkpaperHTML(client, t, props, year, result, meta);
    const ok = printHTML(html);
    flash(ok ? "Print dialog opened - choose 'Save as PDF'." : "Print failed - try the Word export.");
  };

  return (
    <div className="min-h-screen" style={{ backgroundColor: UI.bg, fontFamily: BODY_FONT, fontVariantNumeric: "tabular-nums" }}>
      <header className="px-6 pt-6 pb-4" style={{ backgroundColor: UI.surface, borderBottom: `1px solid ${UI.line}` }}>
        <div className="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h1 className="text-2xl font-bold" style={{ fontFamily: HEAD_FONT, color: UI.ink, letterSpacing: "-0.01em" }}>
              Rental Real Estate Elections Optimizer
            </h1>
            <p className="text-sm mt-1" style={{ color: UI.muted }}>
              Internal planning tool v5.0. Figures verified to Rev. Proc. 2024-40 (as modified), Rev. Proc. 2025-32, and P.L. 119-21. Screening output, not a return position.
            </p>
          </div>
          <div className="flex items-center gap-2" role="group" aria-label="Tax year">
            <span className="text-sm font-bold" style={{ color: UI.ink }}>Tax year</span>
            {[2025, 2026].map((y) => (
              <button key={y} onClick={() => setYear(y)} className="px-3 py-1.5 text-sm font-bold focus:outline-none focus:ring-2"
                style={{ backgroundColor: year === y ? UI.primary : "#fff", color: year === y ? "#fff" : UI.muted, border: `1px solid ${year === y ? UI.primary : UI.line}`, borderRadius: 6 }}>
                {y}

          </div>
        </div>

        {/* Scenario manager bar */}
        <div className="mt-4 px-4 py-3" style={{ backgroundColor: UI.surface, border: `1px solid ${UI.line}`, borderRadius: 6 }}>
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-sm font-bold" style={{ fontFamily: HEAD_FONT, color: UI.ink }}>Scenarios</span>

            {scenarios.length >= 2 && (

                      {cmpAData.r.elections.map((eA) => {
                        const eB = cmpBData.r.elections.find((x) => x.id === eA.id);
                        const differs = eB && eB.status !== eA.status;
                        return (
                          <tr key={eA.id} style={{ borderBottom: `1px solid ${UI.line}`, backgroundColor: differs ? "#EDF2F5" : "transparent" }}>
                            <td className="px-2 py-1" style={{ color: UI.ink }}>{eA.name}{differs ? " ◆" : ""}</td>
                            <td className="px-2 py-1 font-bold" style={{ color: STATUS[eA.status].text }}>{STATUS[eA.status].label}</td>
                            <td className="px-2 py-1 font-bold" style={{ color: eB ? STATUS[eB.status].text : UI.muted }}>{eB ? STATUS[eB.status].label : "-"}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <p className="text-xs mt-1" style={{ color: UI.muted }}>◆ = statuses differ. Typical use: a client's base case vs. a duplicated what-if (e.g., with REP logs in place).</p>
                </div>
              ) : (
                <p className="text-xs" style={{ color: UI.muted }}>Pick two saved scenarios to compare election outcomes side by side.</p>
              )}
            </div>
          )}
        </div>
      </header>

      <div className="flex flex-col lg:flex-row gap-6 p-6 max-w-7xl mx-auto">
        {/* ---------- Inputs ---------- */}
        <div className="lg:w-2/5 shrink-0">
          <h2 className="text-lg font-bold" style={{ fontFamily: HEAD_FONT, color: UI.ink }}>Client profile</h2>

          <SectionTitle>Client information</SectionTitle>
          <TextField label="Client name" value={client.name} onChange={setClientField("name")} placeholder="e.g., Sullivan, Mark & Ellen" />
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
            <TextField label="Client number / TaxDome ID" value={client.number} onChange={setClientField("number")} placeholder="e.g., 1042" />
            <TextField label="Preparer" value={client.preparer} onChange={setClientField("preparer")} placeholder="Initials" />
          </div>
          <TextField label="Engagement notes" value={client.notes} onChange={setClientField("notes")} placeholder="Optional - appears on the internal workpaper only" />

          <SectionTitle>Taxpayer</SectionTitle>
          <Select label="Filing status" value={t.filingStatus} onChange={setField("filingStatus")}
            options={[
              { value: "mfj", label: "Married filing jointly" },
              { value: "single", label: "Single" },
              { value: "hoh", label: "Head of household" },
              { value: "mfs", label: "Married filing separately" },
            ]} />
          <NumField label="MAGI (all sources)" value={t.magi} onChange={setField("magi")} hint="Drives NIIT and the 469(i) allowance phaseout." />
          <NumField label="Taxable income (before QBI deduction)" value={t.taxableIncome} onChange={setField("taxableIncome")}
            warn={t.taxableIncome > t.magi ? "Taxable income exceeds MAGI - likely an input error (MAGI is normally at least taxable income)." : ""}
            hint={`Sets the 199A position against verified ${year} thresholds. Computed: ${result.qbiPosLabel}.`} />
          <Select label="Character of client's other QBI (non-rental)" value={t.otherQBIType} onChange={setField("otherQBIType")}
            options={[
              { value: "none", label: "No other QBI" },
              { value: "qualified", label: "Qualified (non-SSTB) trade/business" },
              { value: "sstb", label: "SSTB (health, law, accounting, consulting, financial services...)" },
              { value: "both", label: "Both qualified and SSTB sources" },
            ]}
            hint="Delineates qualified QBI from SSTB income - drives phase-out caveats and negative-QBI netting warnings." />
          <YesNo label="Other passive income available?" value={t.otherPassiveIncome} onChange={setField("otherPassiveIncome")} />
          <YesNo label="MA resident / MA-source rentals?" value={t.maResident} onChange={setField("maResident")} />
          <YesNo label="Applicable financial statement (AFS)?" value={t.hasAFS} onChange={setField("hasAFS")} hint="De minimis ceiling $5,000 vs $2,500; written policy required." />
          <YesNo label="Average annual gross receipts $10M or less?" value={t.grossReceiptsUnder10M} onChange={setField("grossReceiptsUnder10M")} hint="SHST taxpayer-level gate." />

          <SectionTitle>Real estate professional tests</SectionTitle>
          <YesNo label="A spouse logs 750+ hours in real property businesses?" value={t.spouseHours750} onChange={setField("spouseHours750")} />
          <YesNo label="Same spouse: over half of ALL personal services in real property businesses?" value={t.spouseMoreThanHalf} onChange={setField("spouseMoreThanHalf")}
            hint="Both tests met by one spouse alone. Full-time outside W-2 effectively fails this." />
          <YesNo label="Contemporaneous time logs maintained?" value={t.contemporaneousLogs} onChange={setField("contemporaneousLogs")} />
          <YesNo label="250+ hours of rental services documentable (per enterprise)?" value={t.hours250Documentable} onChange={setField("hours250Documentable")}
            hint="Rev. Proc. 2019-38 - owner, employee, agent, and contractor hours count; mixed portfolios need 250 per enterprise." />

          {anySelfRental && (
            <>
              <SectionTitle>Self-rental structure</SectionTitle>
              <p className="text-xs mb-2" style={{ color: UI.muted }}>Applies to every property flagged as a self-rental. If ownership structures differ across self-rentals, save separate scenarios.</p>
              <YesNo label="Ownership proportionately identical (building vs. op-co)?" value={t.identicalOwnership} onChange={setField("identicalOwnership")} hint="Check the cap tables - required for 1.469-4(d)(1) grouping." />
              <YesNo label="Operating company (tenant) is an SSTB?" value={t.opCoSSTB} onChange={setField("opCoSSTB")} />
              <YesNo label="Client materially participates in the op-co?" value={t.materialParticipationOpCo} onChange={setField("materialParticipationOpCo")} />
            </>
          )}

          <SectionTitle>Property roster ({props.length} / 25)</SectionTitle>
          <div className="flex flex-wrap gap-2 mb-3">
            <button onClick={addProp("residential")} disabled={props.length >= 25} className="px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2"
              style={{ backgroundColor: props.length >= 25 ? UI.line : UI.primary, color: "#fff", border: "none", borderRadius: 6 }}>
              + Add residential
            </button>
            <button onClick={addProp("commercial")} disabled={props.length >= 25} className="px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2"
              style={{ backgroundColor: props.length >= 25 ? UI.line : UI.surface, color: props.length >= 25 ? "#fff" : UI.primary, border: `1px solid ${UI.primary}`, borderRadius: 6 }}>
              + Add commercial
            </button>
            {props.length > 1 && (
              <>
                <button onClick={setAllProps(true)} className="px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2"
                  style={{ backgroundColor: "#fff", color: UI.ink, border: `1px solid ${UI.line}`, borderRadius: 6 }}>
                  Expand all
                </button>
                <button onClick={setAllProps(false)} className="px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2"
                  style={{ backgroundColor: "#fff", color: UI.ink, border: `1px solid ${UI.line}`, borderRadius: 6 }}>
                  Collapse all
                </button>
              </>
            )}
          </div>
          {props.length > 5 && (
            <p className="text-xs mb-2" style={{ color: UI.muted }}>Cards beyond the first five start collapsed - the header row still shows each property's net.</p>
          )}
          {props.map((pr, idx) => (
            <PropertyCard key={pr.id} pr={pr} onChange={updateProp(pr.id)} onRemove={removeProp(pr.id)} open={isPropOpen(pr.id, idx)} onToggle={toggleProp(pr.id, idx)} />
          ))}
          {props.length === 0 && <p className="text-sm" style={{ color: UI.muted }}>No properties yet - add residential or commercial properties above.</p>}
        </div>

        {/* ---------- Results ---------- */}
        <div className="lg:w-3/5">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
            <h2 className="text-lg font-bold" style={{ fontFamily: HEAD_FONT, color: UI.ink }}>
              Recommendations - {client.name || "Unnamed client"} - TY {year}
            </h2>
          </div>

          {/* Export bar */}
          <div className="mb-4 px-4 py-3" style={{ backgroundColor: UI.surface, border: `1px solid ${UI.line}`, borderRadius: 6 }}>
            <div className="text-sm font-bold mb-2" style={{ fontFamily: HEAD_FONT, color: UI.ink }}>Export</div>
            <div className="flex flex-wrap items-center gap-2 mb-2">
              <span className="text-xs w-28 shrink-0" style={{ color: UI.muted }}>Internal workpaper</span>
              <button onClick={() => exportWord("workpaper")} className="px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2" style={{ backgroundColor: UI.primary, color: "#fff", border: "none", borderRadius: 6 }}>
                Word
              </button>
              <button onClick={() => exportPDF("workpaper")} className="px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2" style={{ backgroundColor: UI.surface, color: UI.primary, border: `1px solid ${UI.primary}`, borderRadius: 6 }}>
                PDF (print)
              </button>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-xs w-28 shrink-0" style={{ color: UI.muted }}>Client deliverable</span>
              <button onClick={() => exportWord("client")} className="px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2" style={{ backgroundColor: UI.primary, color: "#fff", border: "none", borderRadius: 6 }}>
                Word
              </button>
              <button onClick={() => exportPDF("client")} className="px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2" style={{ backgroundColor: UI.surface, color: UI.primary, border: `1px solid ${UI.primary}`, borderRadius: 6 }}>
                PDF (print)
              </button>
            </div>
            <p className="text-xs mt-2" style={{ color: UI.muted }}>
              Workpaper: full technical detail, citations, verified sources, preparer/reviewer sign-off block. Client deliverable: plain language, no code citations, figures reserved for the phone call, review-with-another-advisor invitation included. PDF export opens the print dialog - choose "Save as PDF."
            </p>
          </div>

          {/* Triage strip */}
          <div className="flex flex-wrap gap-2 mb-2">
            {TRIAGE_ORDER.filter((k) => triage[k]).map((k) => (
              <span key={k} className="text-xs font-bold px-2.5 py-1" style={{ backgroundColor: STATUS[k].bg, color: STATUS[k].text, border: `1px solid ${STATUS[k].border}`, borderRadius: 6 }}>
                {triage[k]} {STATUS[k].label}
              </span>
            ))}
          </div>

          {/* Summary chips */}
          <div className="flex flex-wrap gap-2 mb-4 text-xs" style={{ color: UI.ink }}>
            <span className="px-2 py-1 bg-white" style={{ border: `1px solid ${UI.line}`, borderRadius: 6 }}>
              {result.totals.res} residential / {result.totals.com} commercial
            </span>
            <span className="px-2 py-1 bg-white" style={{ border: `1px solid ${UI.line}`, borderRadius: 6, color: result.totals.totalNet < 0 ? "#B3372F" : UI.ink }}>
              Portfolio net: {fmt(result.totals.totalNet)}
            </span>
            <span className="px-2 py-1 bg-white" style={{ border: `1px solid ${UI.line}`, borderRadius: 6 }}>
              199A: {result.qbiPosLabel}
            </span>
            {result.totals.exch > 0 && (
              <span className="px-2 py-1 bg-white" style={{ border: `1px solid ${UI.line}`, borderRadius: 6 }}>
                {result.totals.exch} exchange-flagged
              </span>
            )}
          </div>

          {result.elections.map((e) => (<ElectionCard key={e.id} e={e} highlight={changedIds.includes(e.id)} />))}

          {result.flags.length > 0 && (
            <>
              <h2 className="text-lg font-bold mt-6 mb-3" style={{ fontFamily: HEAD_FONT, color: UI.ink }}>Cross-cutting flags</h2>
              {result.flags.map((f, i) => (
                <div key={i} className="mb-3 px-4 py-3" style={{ backgroundColor: UI.surface, border: `1px solid ${UI.line}`, borderTop: `3px solid ${UI.amber}`, borderRadius: 6 }}>
                  <div className="font-bold text-sm mb-1" style={{ fontFamily: HEAD_FONT, color: UI.ink }}>{f.title}</div>
                  <p className="text-sm leading-snug" style={{ color: UI.ink }}>{f.body}</p>
                </div>
              ))}
            </>
          )}

          <div className="mt-6 px-4 py-3" style={{ backgroundColor: "#F2F2EF", border: `1px solid ${UI.line}`, borderRadius: 6 }}>
            <div className="font-bold text-sm mb-1" style={{ fontFamily: HEAD_FONT, color: UI.ink }}>Verified figure sources - TY {year}</div>
            <ul className="text-xs leading-snug" style={{ color: UI.ink, listStyle: "none", padding: 0 }}>
              <li className="mb-1">199A thresholds: MFJ {fmt(F.qbi.mfj.thr)} / top {fmt(F.qbi.mfj.top)}; single-HOH {fmt(F.qbi.other.thr)} / {fmt(F.qbi.other.top)}; MFS {fmt(F.qbi.mfs.thr)} / {fmt(F.qbi.mfs.top)} - {F.qbi.source}</li>
              <li className="mb-1">461(l) EBL: {fmt(F.ebl.joint)} joint / {fmt(F.ebl.other)} other - {F.ebl.source}</li>
              <li className="mb-1">MA surtax threshold: {fmt(F.maSurtax.thr)} - {F.maSurtax.source}</li>
              <li className="mb-1">Static (regulatory/statutory, not indexed): de minimis $2,500 / $5,000 (Reg. 1.263(a)-1(f); Notice 2015-82); SHST $10K / 2% / $1M / $10M (Reg. 1.263(a)-3(h)); NIIT $250K MFJ / $200K single-HOH / $125K MFS (IRC 1411); 469(i) $25K with $100K-$150K phaseout; REP 750 hours; Rev. Proc. 2019-38 250 hours; 1031 45/180 days.</li>
            </ul>
          </div>

          <p className="text-xs mt-4 leading-snug" style={{ color: UI.muted }}>
            Screening tool only. REP, grouping, and aggregation positions are binding and carry elevated exam risk - route first-year elections through a second reviewer before filing. MA notes assume the static 1/1/2022 conformity date; check any OBBBA conformity TIR before relying on MA treatment. Taxpayer-level self-rental answers apply to all flagged self-rental properties; save divergent structures as separate scenarios. Scenario data is stored with this artifact - do not enter SSNs or other identifiers beyond name and client number.
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RentalElectionsOptimizerV3 />);
</script>
</body>
</html>
